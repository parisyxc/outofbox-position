# Builds site/ and publishes it to GitHub Pages.
#
# NOTE: GitHub Pages will not serve a private repository on the free plan. This workflow is
# ready to run, but Pages must first be enabled: repo Settings → Pages → Source: GitHub Actions.
# Until the repo is public (or the account is on Pro/Team), the deploy step will fail there —
# `npm run build` still runs on every push, so the site stays verified either way.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', 'reports/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history — check_ledger.py replays every ledger commit to prove no
          # entry_price was ever rewritten. A shallow clone would see one commit and
          # pass vacuously.
          fetch-depth: 0
      # Refuse to publish a record that violates its own invariants: a moved entry
      # price, a phantom trade in the win rate, a 0% win rate off zero closed trades.
      - name: Check the ledger
        run: python3 scripts/check_ledger.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      # sync.mjs reads ../data and ../reports, so the whole repo must be checked out (it is).
      - name: Build
        working-directory: site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # GitHub Pages cannot serve a private repository on a free personal account, and
  # deploy-pages 404s if Pages was never enabled. Gating on visibility keeps the build
  # green (and still verified) until the repo is made public — at which point this runs
  # on its own, provided Settings → Pages → Source is set to "GitHub Actions".
  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
